name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（main 上のコミットに打たれたもの）"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::不正なタグ名です: $TAG"
            exit 1
          fi
          if ! commit="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
            echo "::error::タグが見つかりません: $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::タグ $TAG ($commit) は main ブランチ上のコミットではありません"
            exit 1
          fi
          echo "deploying $TAG ($commit)"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash -l -s -- "'$DEPLOY_PATH'" "'$TAG'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch --force --tags origin
          git checkout --detach "refs/tags/$2"
          exec script/deploy.sh
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
