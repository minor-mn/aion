get:
  summary: ユーザー情報取得
  tags:
    - Users
  security:
    - bearerAuth: []
  responses:
    "200":
      description: 現在のユーザー情報
      content:
        application/json:
          schema:
            $ref: "../../schemas/user-response.yaml"
          example:
            user:
              id: 1
              username: "alice"
              nickname: "Alice"
              role: "user"
    "401":
      description: 認証エラー
      content:
        application/json:
          example:
            error: "Authentication failed"
