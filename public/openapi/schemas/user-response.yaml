type: object
properties:
  id:
    type: integer
    example: 1
  username:
    type: string
    description: 認証サーバのユーザー名
    example: "alice"
  nickname:
    type: string
    nullable: true
    description: 認証サーバのニックネーム
    example: "Alice"
  role:
    type: string
    enum: [admin, operator, user]
    example: "user"
